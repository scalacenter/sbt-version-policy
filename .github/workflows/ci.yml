name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        cache: 'sbt'
    - uses: sbt/setup-sbt@v1
    - name: Run unit and compatibility tests
      run: sbt "+ test" versionPolicyCheck
    - name: Run scripted tests, including historical consumer compilers
      if: matrix.java == 17
      run: sbt "+ scripted"

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Release
        run: sbt versionCheck ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
